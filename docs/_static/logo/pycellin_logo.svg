<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pycellin logo, rebuilt from "pycellin_logo_correct alignment.svg" with simple
  shapes and the colours of pycellin/styling.py. Dots that line up share
  exactly the same x or y.
  - Dot centres sit on a grid: x on multiples of 4, y on multiples of 5.
    Off the grid: the end of the E's middle arm (y 147.5), parallel to the other
      E arms.
    Off the grid: the P's stem (x 214.667) and last dot (x 234.667), 1.333 left
      of the grid, so that the P's bulge mirrors the C's middle dot about the
      Y's stem and the P's lower arm is parallel to the Y and C arms.
  - Bars are <line> strokes: their width is stroke-width on the "logo" group.
  - Dots are <circle> elements, all with the same radius r: change r on every
    circle (find and replace) to resize them all.
  - Bars end at dot centres, so their ends stay hidden while r is at least
    half the bar width.
  - The viewBox fits dots of radius 7.25: refit it after changing r
    (in Inkscape: select all, then Edit > Resize Page to Selection).
-->
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   width="85.680814mm"
   height="32.940625mm"
   viewBox="207.417 87.75 323.833 124.5">
  <g id="logo" stroke-width="5.6" stroke-linecap="butt">
    <g id="letter-p" inkscape:label="P" fill="#982fc4" stroke="#982fc4">
      <g id="p-bars" inkscape:label="bars">
        <line x1="248" y1="145" x2="234.667" y2="165" />
        <line x1="214.667" y1="125" x2="214.667" y2="205" />
        <line x1="214.667" y1="125" x2="248" y2="145" />
      </g>
      <g id="p-dots" inkscape:label="dots" stroke="none">
        <circle cx="214.667" cy="125" r="7.25" />
        <circle cx="214.667" cy="165" r="7.25" />
        <circle cx="214.667" cy="205" r="7.25" />
        <circle cx="234.667" cy="165" r="7.25" />
        <circle cx="248" cy="145" r="7.25" />
      </g>
    </g>
    <g id="letter-y" inkscape:label="Y" fill="#982fc4" stroke="#982fc4">
      <g id="y-bars" inkscape:label="bars">
        <line x1="276" y1="160" x2="256" y2="190" />
        <line x1="276" y1="125" x2="276" y2="160" />
        <line x1="276" y1="160" x2="296" y2="190" />
      </g>
      <g id="y-dots" inkscape:label="dots" stroke="none">
        <circle cx="256" cy="190" r="7.25" />
        <circle cx="276" cy="125" r="7.25" />
        <circle cx="276" cy="160" r="7.25" />
        <circle cx="296" cy="190" r="7.25" />
      </g>
    </g>
    <g id="letter-c" inkscape:label="C" fill="#dd397d" stroke="#dd397d">
      <g id="c-bars" inkscape:label="bars">
        <line x1="324" y1="115" x2="304" y2="145" />
        <line x1="304" y1="145" x2="324" y2="175" />
      </g>
      <g id="c-dots" inkscape:label="dots" stroke="none">
        <circle cx="304" cy="145" r="7.25" />
        <circle cx="324" cy="115" r="7.25" />
        <circle cx="324" cy="175" r="7.25" />
      </g>
    </g>
    <g id="letter-e" inkscape:label="E" fill="#dd397d" stroke="#dd397d">
      <g id="e-bars" inkscape:label="bars">
        <line x1="352" y1="115" x2="352" y2="165" />
        <line x1="352" y1="115" x2="384" y2="125" />
        <line x1="352" y1="165" x2="384" y2="175" />
        <line x1="352" y1="140" x2="376" y2="147.5" />
      </g>
      <g id="e-dots" inkscape:label="dots" stroke="none">
        <circle cx="352" cy="115" r="7.25" />
        <circle cx="352" cy="140" r="7.25" />
        <circle cx="352" cy="165" r="7.25" />
        <circle cx="376" cy="147.5" r="7.25" />
        <circle cx="384" cy="125" r="7.25" />
        <circle cx="384" cy="175" r="7.25" />
      </g>
    </g>
    <g id="letter-l1" inkscape:label="L" fill="#dd397d" stroke="#dd397d">
      <g id="l1-bars" inkscape:label="bars">
        <line x1="412" y1="95" x2="412" y2="190" />
      </g>
      <g id="l1-dots" inkscape:label="dots" stroke="none">
        <circle cx="412" cy="95" r="7.25" />
        <circle cx="412" cy="125" r="7.25" />
        <circle cx="412" cy="190" r="7.25" />
      </g>
    </g>
    <g id="letter-l2" inkscape:label="L" fill="#f46c00" stroke="#f46c00">
      <g id="l2-bars" inkscape:label="bars">
        <line x1="440" y1="115" x2="440" y2="200" />
      </g>
      <g id="l2-dots" inkscape:label="dots" stroke="none">
        <circle cx="440" cy="115" r="7.25" />
        <circle cx="440" cy="155" r="7.25" />
        <circle cx="440" cy="200" r="7.25" />
      </g>
    </g>
    <g id="letter-i" inkscape:label="I" fill="#f46c00" stroke="#f46c00">
      <g id="i-bars" inkscape:label="bars">
        <line x1="468" y1="155" x2="468" y2="190" />
      </g>
      <g id="i-dots" inkscape:label="dots" stroke="none">
        <circle cx="468" cy="125" r="7.25" />
        <circle cx="468" cy="155" r="7.25" />
        <circle cx="468" cy="190" r="7.25" />
      </g>
    </g>
    <g id="letter-n" inkscape:label="N" fill="#f46c00" stroke="#f46c00">
      <g id="n-bars" inkscape:label="bars">
        <line x1="524" y1="115" x2="524" y2="145" />
        <line x1="496" y1="125" x2="496" y2="185" />
        <line x1="496" y1="125" x2="524" y2="175" />
      </g>
      <g id="n-dots" inkscape:label="dots" stroke="none">
        <circle cx="496" cy="125" r="7.25" />
        <circle cx="496" cy="185" r="7.25" />
        <circle cx="524" cy="115" r="7.25" />
        <circle cx="524" cy="145" r="7.25" />
        <circle cx="524" cy="175" r="7.25" />
      </g>
    </g>
  </g>
</svg>
