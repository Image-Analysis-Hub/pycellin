[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pycellin"
version = "0.6.0.dev0"
authors = [{ name = "Laura Xénard", email = "laura.xenard@protonmail.com" }]
description = "Graph-based framework to manipulate and analyze cell lineages from cell tracking data"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "geff>=1.1.3.1.1",
    "geff-spec>=1.1",
    "igraph>=0.9",
    "lxml>=5",
    "networkx>=3",
    "numpy>=1.24",
    "pandas>=2.2.2",
    "pillow>=9.1",
    "plotly>=5.12",
    "scikit-image>=0.24",
    "scipy>=1.15",
    "shapely>=2.0.4",
    "tifffile>=2022.8.12",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel",
    "jupyterlab",
    "nbformat>=4.2.0",
]

[project.urls]
Documentation = "https://Image-Analysis-Hub.github.io/pycellin/"
Examples = "https://Image-Analysis-Hub.github.io/pycellin/notebooks/"
Issues = "https://github.com/Image-Analysis-Hub/pycellin/issues"
Source = "https://github.com/Image-Analysis-Hub/pycellin/"

[dependency-groups]
test = [
    "matplotlib>=3.8.4",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.setuptools.packages.find]
include = ["pycellin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
