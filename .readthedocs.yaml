# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    install:
      # Same install as the GitHub workflows. Replacing this step stops Read the Docs
      # from updating pip, and dependency groups need pip 25.1 or later.
      - pip install --upgrade pip
      - pip install . --group docs

sphinx:
  configuration: docs/conf.py
  # Fail on any warning (sphinx-build -W --keep-going), e.g. a broken reference or a
  # docstring that numpydoc's validation rejects.
  fail_on_warning: true
